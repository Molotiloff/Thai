# Thai CRM: independent schema, no legacy data migrations.
# URL БД не хранится здесь: env.py берёт его из attributes (программный запуск
# через db_asyncpg.migrator.AlembicMigrator) или из DATABASE_URL (.env / окружение).

[alembic]
script_location = %(here)s/db_asyncpg/thai_migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
